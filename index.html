<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.M.I. "Santa Celia" - Sistema Integrado</title>

    <style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --primary-bg: #e3f2fd;
            --text-color: #333333;
            --page-bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* === LOGIN SCREEN === */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0081c9, #0056b3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: #222;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .btn-primary-login {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary-login:hover {
            background: var(--primary-dark);
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        /* === DASHBOARD GENERAL === */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 1100px;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .title-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .brand h1 {
            color: #263238;
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .area-badge {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            border: 1px solid var(--primary-color);
            text-transform: uppercase;
        }

        .action-btn {
            background: white;
            border: 1px solid #ddd;
            color: #555;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .action-btn:hover {
            background: #f0f0f0;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* === BARRA DE BÚSQUEDA === */
        .search-container {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 45px 14px 45px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            background-color: white;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-bg);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999;
            cursor: pointer;
            display: none;
        }
        .clear-search:hover { color: var(--primary-color); }

        /* === BOTÓN ACTUALIZAR DATOS === */
        .refresh-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: filter 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .refresh-btn:hover { filter: brightness(0.9); }

        /* === TABLA Y DISEÑO RESPONSIVO === */
        .table-container {
            width: 100%;
            background: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 700;
        }

        tr:hover { background-color: #f9f9f9; }

        .loading {
            padding: 30px;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            background: white;
            border-radius: 8px;
        }

        /* DISEÑO MÓVIL EN TARJETAS (ESTILO TU APP) */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
                width: 100%;
            }
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                margin-bottom: 15px;
                border: 1px solid #b0bec5;
                border-top: 5px solid var(--primary-color);
                border-radius: 10px;
                box-shadow: 0 3px 6px rgba(0,0,0,0.1);
                background-color: #ffffff;
                overflow: hidden;
            }
            td {
                border: none;
                border-bottom: 1px solid #f0f0f0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 12px;
                text-align: right;
                box-sizing: border-box;
                font-size: 0.9rem;
            }
            td:last-child { border-bottom: 0; }
            td::before {
                content: attr(data-label);
                font-weight: 800;
                color: var(--primary-color);
                text-align: left;
                padding-right: 10px;
                max-width: 45%;
                font-size: 0.75rem;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>C.M.I. "Santa Celia"</h2>
            <p>Sistema Integrado de Acceso</p>
            
            <form onsubmit="ejecutarLogin(event)">
                <div class="form-group">
                    <label>ID de Usuario:</label>
                    <input type="text" id="login-id" class="form-control" placeholder="Ej. USER o ID" required>
                </div>
                
                <div class="form-group">
                    <label>PIN de Acceso:</label>
                    <input type="password" id="login-pin" class="form-control" placeholder="********" required>
                </div>

                <div class="form-group">
                    <label>Área o Servicio Obligatorio:</label>
                    <select id="login-area" class="form-control" required>
                        <option value="" disabled selected>-- Seleccione un área --</option>
                        <option value="MEDICINA GENERAL">Medicina General</option>
                        <option value="ODONTOLOGIA">Odontología</option>
                        <option value="LABORATORIO">Laboratorio</option>
                        <option value="BOTICA">Botica</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary-login">Ingresar al Sistema</button>
                <div id="error-box" class="error-msg">ID, PIN o área incorrectos. Verifique sus datos.</div>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD / VISOR MODERNO -->
    <div id="dashboard">
        <div class="header">
            <div class="title-bar">
                <div class="brand">
                    <h1 id="app-title-text">Historial Clínico</h1>
                </div>
                <div class="header-actions">
                    <span id="header-badge" class="area-badge">ÁREA</span>
                    <button class="action-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>

            <!-- CONTENEDOR DE BÚSQUEDA Y ACTUALIZAR -->
            <div id="search-and-refresh-area" style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" oninput="filtrarTabla()" placeholder="Buscar paciente, DNI, diagnóstico, médico...">
                    <svg class="clear-search" id="clearSearchBtn" onclick="limpiarBusqueda()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>

                <button class="refresh-btn" onclick="cargarDatosHistorial()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Actualizar Registros
                </button>
            </div>
        </div>

        <!-- TABLA DINÁMICA -->
        <div class="table-container">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="10" class="loading">Cargando registros...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA, SEGURIDAD Y CONSUMO DE DATOS -->
    <script>
        const sheetId = '17OvVxayB1wjiB2z8RIGcc_S68F4AWstFZuLGWdctVNg';
        const gidSheet = '0'; // Pestaña principal por defecto

        const usuariosAutorizados = {
            "MEDICINA GENERAL": { "medico1": "1234", "drfernando": "5678" },
            "ODONTOLOGIA":      { "dentista1": "1111", "odonto": "2222" },
            "LABORATORIO":      { "lab1": "3333" },
            "BOTICA":           { "botica1": "4444" }
        };

        const temasArea = {
            "MEDICINA GENERAL": { primary: "#0056b3", dark: "#003d80", bg: "#e3f2fd" },
            "ODONTOLOGIA":      { primary: "#00897b", dark: "#004d40", bg: "#e0f2f1" },
            "LABORATORIO":      { primary: "#7b1fa2", dark: "#4a148c", bg: "#f3e5f5" },
            "BOTICA":           { primary: "#e65100", dark: "#bf360c", bg: "#fbe9e7" }
        };

        let areaActual = "";

        function ejecutarLogin(event) {
            event.preventDefault();
            const idInput = document.getElementById('login-id').value.trim();
            const pinInput = document.getElementById('login-pin').value.trim();
            const selectArea = document.getElementById('login-area');
            const errorBox = document.getElementById('error-box');

            areaActual = selectArea.value;
            let accesoConcedido = false;
            let esSuperUser = false;

            if (idInput === "USER" && pinInput === "171819") {
                if (!areaActual) {
                    errorBox.textContent = "Por favor, seleccione un área.";
                    errorBox.style.display = "block";
                    return;
                }
                accesoConcedido = true;
                esSuperUser = true;
            } else if (areaActual && usuariosAutorizados[areaActual]) {
                const credenciales = usuariosAutorizados[areaActual];
                if (credenciales[idInput] && credenciales[idInput] === pinInput) {
                    accesoConcedido = true;
                }
            }

            if (!accesoConcedido) {
                errorBox.textContent = "ID o PIN incorrectos para el área seleccionada.";
                errorBox.style.display = "block";
                return;
            }

            errorBox.style.display = "none";
            aplicarTema(areaActual, esSuperUser);

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';

            // Si es Botica, dejamos en blanco como se pidió
            if (areaActual === "BOTICA") {
                document.getElementById('search-and-refresh-area').style.display = 'none';
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="10" class="loading" style="background: white; color: #666; padding: 40px;">
                        <h3>Módulo de Botica en blanco</h3>
                        <p>Este espacio se configurará próximamente.</p>
                    </td></tr>`;
                document.getElementById('table-head').innerHTML = '';
            } else {
                document.getElementById('search-and-refresh-area').style.display = 'flex';
                cargarDatosHistorial();
            }
        }

        function aplicarTema(area, esSuperUser) {
            const tema = temasArea[area] || temasArea["MEDICINA GENERAL"];
            const root = document.documentElement;

            root.style.setProperty('--primary-color', tema.primary);
            root.style.setProperty('--primary-dark', tema.dark);
            root.style.setProperty('--primary-bg', tema.bg);

            const textoBadge = esSuperUser ? `${area} (SÚPER)` : area;
            document.getElementById('header-badge').textContent = textoBadge;
            document.getElementById('app-title-text').textContent = `Historial Clínico - ${area}`;
        }

        function limpiarBusqueda() {
            const input = document.getElementById('searchInput');
            input.value = '';
            filtrarTabla();
            input.focus();
        }

        function filtrarTabla() {
            const filtro = document.getElementById('searchInput').value.toLowerCase();
            const filas = document.getElementById('table-body').getElementsByTagName('tr');
            const clearBtn = document.getElementById('clearSearchBtn');

            clearBtn.style.display = filtro.length > 0 ? 'block' : 'none';

            for (let i = 0; i < filas.length; i++) {
                if (filas[i].querySelector('.loading')) continue;
                let textoFila = filas[i].textContent || filas[i].innerText;
                filas[i].style.display = textoFila.toLowerCase().indexOf(filtro) > -1 ? "" : "none";
            }
        }

        async function cargarDatosHistorial() {
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-head');
            const inputBusqueda = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');

            tbody.innerHTML = '<tr><td colspan="10" class="loading">Sincronizando con Google Sheets...</td></tr>';
            inputBusqueda.value = "";
            clearBtn.style.display = 'none';

            const noCache = new Date().getTime();
            const urlTabla = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gidSheet}&_=${noCache}`;

            try {
                const response = await fetch(urlTabla);
                const text = await response.text();
                const jsonString = text.substring(text.indexOf('({') + 1, text.lastIndexOf('})') + 1);
                const data = JSON.parse(jsonString);

                thead.innerHTML = '';
                tbody.innerHTML = '';

                const headers = data.table.cols;
                let trHead = document.createElement('tr');
                headers.forEach(header => {
                    if (header.label) {
                        let th = document.createElement('th');
                        th.innerText = header.label;
                        trHead.appendChild(th);
                    }
                });
                thead.appendChild(trHead);

                const rows = data.table.rows.reverse();

                if (rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="loading">No hay registros en la hoja todavía.</td></tr>';
                    return;
                }

                rows.forEach(row => {
                    let tr = document.createElement('tr');
                    row.c.forEach((cell, index) => {
                        if (index < headers.length && headers[index].label) {
                            let td = document.createElement('td');
                            td.setAttribute('data-label', headers[index].label);
                            td.innerText = (cell && cell.f) ? cell.f : (cell && cell.v ? cell.v : '-');
                            tr.appendChild(td);
                        }
                    });
                    tbody.appendChild(tr);
                });

            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="10" class="loading" style="color:red;">Error de conexión con la hoja. Verifique internet.</td></tr>';
            }
        }

        function cerrarSesion() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-id').value = '';
            document.getElementById('login-pin').value = '';
            document.getElementById('login-area').selectedIndex = 0;
            areaActual = "";
        }
    </script>
</body>
</html>
