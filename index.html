<style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --primary-bg: #e3f2fd;
            --text-color: #333333;
            --page-bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* === LOGIN SCREEN === */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0081c9, #0056b3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: #222;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .btn-primary-login {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary-login:hover {
            background: var(--primary-dark);
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        /* === DASHBOARD GENERAL === */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .title-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .brand h1 {
            color: #263238;
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .area-badge {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            border: 1px solid var(--primary-color);
            text-transform: uppercase;
        }

        .action-btn {
            background: white;
            border: 1px solid #ddd;
            color: #555;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .action-btn:hover {
            background: #f0f0f0;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* === CONTROLES DE BÚSQUEDA E IMPRESIÓN === */
        .controls-row {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 45px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            background-color: white;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-bg);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999;
            cursor: pointer;
            display: none;
        }
        .clear-search:hover { color: var(--primary-color); }

        .print-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        .print-btn:hover { background-color: #1b5e20; }

        .refresh-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: filter 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .refresh-btn:hover { filter: brightness(0.9); }

        /* === TABLA Y DISEÑO RESPONSIVO === */
        .table-container {
            width: 100%;
            background: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 700;
        }

        tr:hover { background-color: #f9f9f9; }

        .loading {
            padding: 30px;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            background: white;
            border-radius: 8px;
        }

        /* === BLOQUE DE FIRMA Y SELLO === */
        .print-signature-section {
            display: none;
            margin-top: 80px;
            width: 100%;
            justify-content: flex-end;
            page-break-inside: avoid;
        }

        .signature-box {
            width: 320px;
            text-align: center;
            border-top: 1.5px solid #333;
            padding-top: 10px;
        }

        .signature-box p {
            margin: 4px 0;
            font-size: 0.95rem;
            color: #222;
            font-weight: bold;
            text-align: left;
        }

        /* === REGLAS DE IMPRESIÓN (BLOQUEO DE ENCABEZADOS Y PIES DEL NAVEGADOR) === */
        @media print {
            @page {
                size: landscape;
                margin: 10mm; /* Elimina los márgenes predeterminados del navegador que generan los textos automáticos */
            }
            body { background: white; padding: 0; }
            
            #login-screen, .header-actions, .controls-row, .refresh-btn, .title-bar { display: none !important; }
            
            #dashboard { display: block !important; width: 100%; max-width: 100%; }
            .table-container { box-shadow: none; }
            table { box-shadow: none; border: 1px solid #ccc; font-size: 11pt; }
            th { background-color: #f0f0f0 !important; color: black !important; -webkit-print-color-adjust: exact; }
            tr { break-inside: avoid; }
            
            .print-signature-section { display: flex !important; }
        }

        /* DISEÑO MÓVIL EN TARJETAS */
        @media (max-width: 768px) {
            .controls-row { flex-direction: column; }
            .print-btn { padding: 12px; justify-content: center; }

            table, thead, tbody, th, td, tr {
                display: block;
                width: 100%;
            }
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                margin-bottom: 15px;
                border: 1px solid #b0bec5;
                border-top: 5px solid var(--primary-color);
                border-radius: 10px;
                box-shadow: 0 3px 6px rgba(0,0,0,0.1);
                background-color: #ffffff;
                overflow: hidden;
            }
            td {
                border: none;
                border-bottom: 1px solid #f0f0f0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 12px;
                text-align: right;
                box-sizing: border-box;
                font-size: 0.9rem;
            }
            td:last-child { border-bottom: 0; }
            td::before {
                content: attr(data-label);
                font-weight: 800;
                color: var(--primary-color);
                text-align: left;
                padding-right: 10px;
                max-width: 45%;
                font-size: 0.75rem;
                text-transform: uppercase;
            }
        }
    </style>
