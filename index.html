<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.M.I. "Santa Celia" - Medicina General</title>

    <style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --bg-color: #f4f6f9;
            --sidebar-width: 240px;
            --border-color: #e2e8f0;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* LOGIN */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0081c9;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: #222;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn-primary {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* DASHBOARD */
        #dashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .header-title {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .specialty-badge {
            background-color: #e3f2fd;
            color: #0d47a1;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            border: 1px solid #bbdefb;
            text-transform: uppercase;
        }

        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
        }

        aside {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #444;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #e8f0fe;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
        }

        main {
            flex: 1;
            padding: 24px;
            max-width: 900px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        .card-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-color);
        }

        .card-header-title h3 {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 800;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full-width {
            grid-column: span 2;
        }

        textarea.form-control {
            min-height: 80px;
            resize: vertical;
        }

        /* MENSAJE DE NOTIFICACIÓN */
        .status-message {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            margin-bottom: 15px;
        }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <!-- 1. LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>C.M.I. "Santa Celia"</h2>
            <p>Ingrese sus credenciales de trabajador</p>
            
            <form onsubmit="ejecutarLogin(event)">
                <div class="form-group">
                    <label>Usuario o Correo:</label>
                    <input type="text" id="login-user" class="form-control" placeholder="Ingrese su usuario" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" class="form-control" placeholder="********" required>
                </div>

                <div class="form-group">
                    <label>Especialidad / Área:</label>
                    <select id="login-area" class="form-control">
                        <option value="Medicina General" selected>Medicina General</option>
                        <option value="Odontología">Odontología</option>
                        <option value="Pediatría">Pediatría</option>
                        <option value="Ginecología">Ginecología</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard">
        <header>
            <div class="header-title">Centro Médico Integral "Santa Celia"</div>
            <div class="user-info">
                <span id="area-badge" class="specialty-badge">MEDICINA GENERAL</span>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="main-wrapper">
            <aside>
                <div class="menu-item">🏠 Inicio</div>
                <div class="menu-item active">🩺 Registro de Atenciones</div>
                <div class="menu-item">💊 Control de Medicamentos</div>
                <div class="menu-item">📅 Agendar Citas</div>
                <div class="menu-item">📁 Consultar Historial</div>
            </aside>

            <main>
                <div class="card">
                    <div class="card-header-title">
                        <span>📝</span>
                        <h3>Registro de Atención</h3>
                        <span id="form-area-badge" class="specialty-badge">MEDICINA GENERAL</span>
                    </div>

                    <div id="statusAlert" class="status-message"></div>

                    <form id="atencionForm" class="form-grid" onsubmit="guardarEnGoogleSheets(event)">
                        <div class="form-group">
                            <label>Fecha:</label>
                            <input type="text" id="input-fecha" name="fecha" class="form-control" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label>DNI del Paciente:</label>
                            <input type="text" id="input-dni" name="dni" class="form-control" placeholder="Ingrese DNI" required maxlength="8">
                        </div>

                        <div class="form-group full-width">
                            <label>Nombres y Apellidos del Paciente:</label>
                            <input type="text" id="input-paciente" name="nombres" class="form-control" placeholder="Nombre completo" required>
                        </div>

                        <div class="form-group">
                            <label>Hora de Inicio:</label>
                            <input type="time" id="input-hora-inicio" name="horaInicio" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Hora Final:</label>
                            <input type="time" id="input-hora-final" name="horaFinal" class="form-control" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Diagnóstico:</label>
                            <textarea id="input-diagnostico" name="diagnostico" class="form-control" placeholder="Detalle del diagnóstico médico..." required></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label>Medicamentos Recetados:</label>
                            <input type="text" id="input-medicamentos" name="medicamentos" class="form-control" placeholder="Ej. Paracetamol 500mg - 1 cada 8h">
                        </div>

                        <div class="form-group">
                            <label>Médico Tratante:</label>
                            <input type="text" id="input-medico" name="medico" class="form-control" placeholder="Nombre del Médico">
                        </div>

                        <div class="form-group">
                            <label>Observaciones:</label>
                            <input type="text" id="input-observaciones" name="observaciones" class="form-control" placeholder="Notas adicionales">
                        </div>

                        <div class="form-group full-width">
                            <button type="submit" id="btnGuardar" class="btn-primary">
                                Guardar Atención en Google Sheets
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT INTEGRADO -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx9opki9itcB5WDEZBtu-ylzEZqDHqWa_Ejw3XyGu9z9MQ4s6-_Rp5b_qbuLuZ3JYcl/exec';

        // Autocompletar la fecha actual al cargar
        const hoy = new Date();
        const dia = String(hoy.getDate()).padStart(2, '0');
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const anio = hoy.getFullYear();
        document.getElementById('input-fecha').value = `${dia}/${mes}/${anio}`;

        function ejecutarLogin(event) {
            event.preventDefault();
            const usuario = document.getElementById('login-user').value;
            const area = document.getElementById('login-area').value.toUpperCase();

            document.getElementById('area-badge').textContent = area;
            document.getElementById('form-area-badge').textContent = area;
            document.getElementById('input-medico').value = usuario;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }

        function cerrarSesion() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        function guardarEnGoogleSheets(event) {
            event.preventDefault();
            
            const btnGuardar = document.getElementById('btnGuardar');
            const statusAlert = document.getElementById('statusAlert');
            const form = document.getElementById('atencionForm');
            
            btnGuardar.disabled = true;
            btnGuardar.innerText = 'Guardando en Google Sheets...';
            statusAlert.style.display = 'none';

            // Capturar directamente todos los inputs con sus atributos 'name'
            const formData = new FormData(form);

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                statusAlert.className = 'status-message status-success';
                statusAlert.innerText = '¡Atención guardada correctamente en Google Sheets!';
                statusAlert.style.display = 'block';

                const medicoActual = document.getElementById('input-medico').value;
                form.reset();
                document.getElementById('input-fecha').value = `${dia}/${mes}/${anio}`;
                document.getElementById('input-medico').value = medicoActual;
            })
            .catch(error => {
                statusAlert.className = 'status-message status-error';
                statusAlert.innerText = 'Ocurrió un error al intentar guardar los datos.';
                statusAlert.style.display = 'block';
            })
            .finally(() => {
                btnGuardar.disabled = false;
                btnGuardar.innerText = 'Guardar Atención en Google Sheets';
            });
        }
    </script>
</body>
</html>
