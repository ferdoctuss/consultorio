<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.M.I. "Santa Celia" - Sistema Integrado</title>

    <style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --bg-color: #f4f6f9;
            --sidebar-width: 240px;
            --border-color: #e2e8f0;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* LOGIN */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0081c9, #0056b3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: #222;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn-primary {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        /* DASHBOARD */
        #dashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .area-badge {
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
        }

        aside {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #444;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .menu-item.active {
            font-weight: 700;
        }

        main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .card {
            background: white;
            border-radius: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 550px;
        }

        .card-header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }

        .card-header-title h3 {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .content-area {
            padding: 30px;
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>C.M.I. "Santa Celia"</h2>
            <p>Ingrese sus credenciales y seleccione el área</p>
            
            <form onsubmit="ejecutarLogin(event)">
                <div class="form-group">
                    <label>ID de Usuario:</label>
                    <input type="text" id="login-id" class="form-control" placeholder="Ej. USER o ID de empleado" required>
                </div>
                
                <div class="form-group">
                    <label>PIN de Acceso:</label>
                    <input type="password" id="login-pin" class="form-control" placeholder="********" required>
                </div>

                <div class="form-group">
                    <label>Área o Servicio Obligatorio:</label>
                    <select id="login-area" class="form-control" required>
                        <option value="" disabled selected>-- Seleccione un área --</option>
                        <option value="MEDICINA GENERAL">Medicina General</option>
                        <option value="ODONTOLOGIA">Odontología</option>
                        <option value="LABORATORIO">Laboratorio</option>
                        <option value="BOTICA">Botica</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
                <div id="error-box" class="error-msg">ID o PIN incorrectos. Verifique sus datos.</div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <header id="app-header">
            <div id="header-title" class="header-title">Centro Médico Integral "Santa Celia"</div>
            <div class="user-info">
                <span id="area-badge" class="area-badge">ÁREA</span>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="main-wrapper">
            <aside>
                <div id="menu-historial" class="menu-item active">📁 Historial Clínico</div>
            </aside>

            <main>
                <div class="card">
                    <div class="card-header-title">
                        <h3 id="panel-title">Historial Clínico</h3>
                        <span id="form-area-badge" class="area-badge">ÁREA</span>
                    </div>

                    <div class="content-area" id="panel-content">
                        <!-- Contenido dinámico según el área -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- SCRIPT DE CONTROL Y TEMAS -->
    <script>
        // Configuración de colores por área
        const temasArea = {
            "MEDICINA GENERAL": {
                primary: "#0056b3",
                dark: "#003d80",
                lightBg: "#e3f2fd",
                badgeColor: "#0d47a1"
            },
            "ODONTOLOGIA": {
                primary: "#00897b",
                dark: "#004d40",
                lightBg: "#e0f2f1",
                badgeColor: "#004d40"
            },
            "LABORATORIO": {
                primary: "#7b1fa2",
                dark: "#4a148c",
                lightBg: "#f3e5f5",
                badgeColor: "#4a148c"
            },
            "BOTICA": {
                primary: "#e65100",
                dark: "#bf360c",
                lightBg: "#fbe9e7",
                badgeColor: "#bf360c"
            }
        };

        function ejecutarLogin(event) {
            event.preventDefault();
            const idInput = document.getElementById('login-id').value.trim();
            const pinInput = document.getElementById('login-pin').value.trim();
            const selectArea = document.getElementById('login-area');
            const errorBox = document.getElementById('error-box');

            let areaSeleccionada = selectArea.value;

            // Validación de Súper Usuario
            if (idInput === "USER" && pinInput === "171819") {
                if (!areaSeleccionada) {
                    errorBox.textContent = "Por favor, seleccione un área para ingresar como Súper Usuario.";
                    errorBox.style.display = "block";
                    return;
                }
                // Acceso concedido a cualquier área seleccionada
            } else {
                // Validación genérica de ejemplo (puedes ajustar tus validaciones de ID/PIN reales aquí)
                if (pinInput.length < 4) {
                    errorBox.textContent = "ID o PIN incorrectos. Intente nuevamente.";
                    errorBox.style.display = "block";
                    return;
                }
            }

            errorBox.style.display = "none";
            aplicarTemaYContenido(areaSeleccionada, idInput === "USER");

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }

        function aplicarTemaYContenido(area, esSuperUser) {
            const tema = temasArea[area] || temasArea["MEDICINA GENERAL"];
            
            // Aplicar colores dinámicos
            document.documentElement.style.setProperty('--primary-color', tema.primary);
            document.documentElement.style.setProperty('--primary-dark', tema.dark);

            // Textos e insignias
            const nombreAreaTexto = esSuperUser ? `${area} (SÚPER USUARIO)` : area;
            
            document.getElementById('header-title').style.color = tema.primary;
            document.getElementById('area-badge').textContent = nombreAreaTexto;
            document.getElementById('area-badge').style.backgroundColor = tema.lightBg;
            document.getElementById('area-badge').style.color = tema.badgeColor;

            document.getElementById('form-area-badge').textContent = area;
            document.getElementById('form-area-badge').style.backgroundColor = tema.lightBg;
            document.getElementById('form-area-badge').style.color = tema.badgeColor;

            // Estilos del menú lateral activo
            const menuItem = document.getElementById('menu-historial');
            menuItem.style.backgroundColor = tema.lightBg;
            menuItem.style.color = tema.primary;
            menuItem.style.borderLeft = `4px solid ${tema.primary}`;

            // Manejo específico para la Botica (dejada en blanco)
            const panelContent = document.getElementById('panel-content');
            const panelTitle = document.getElementById('panel-title');

            if (area === "BOTICA") {
                panelTitle.textContent = "Botica - Módulo en Desarrollo";
                panelContent.innerHTML = `
                    <div style="text-align: center; color: #888; padding: 50px;">
                        <h3>Módulo de Botica en blanco</h3>
                        <p>Este espacio se configurará próximamente.</p>
                    </div>
                `;
                menuItem.style.display = 'none'; // Ocultar pestaña si está en blanco
            } else {
                panelTitle.textContent = "Historial Clínico - " + area;
                panelContent.innerHTML = `
                    <div style="color: #444;">
                        <h4 style="margin-bottom: 15px; color: ${tema.primary};">Gestión de Registros Médicos</h4>
                        <p>Bienvenido al sistema de ${area}. Aquí podrás visualizar los expedientes y antecedentes correspondientes.</p>
                        <!-- Inserta aquí tu visor o contenido de AppSheet/Google Sheets -->
                    </div>
                `;
                menuItem.style.display = 'flex';
            }
        }

        function cerrarSesion() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-id').value = '';
            document.getElementById('login-pin').value = '';
            document.getElementById('login-area').selectedIndex = 0;
        }
    </script>
</body>
</html>
