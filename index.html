<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.M.I. "Santa Celia" - Sistema Integrado</title>

    <style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --primary-bg: #e3f2fd;
            --text-color: #333333;
            --page-bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* === LOGIN SCREEN === */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0081c9, #0056b3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: #222;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .btn-primary-login {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        /* === DASHBOARD GENERAL === */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .title-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .brand h1 {
            color: #263238;
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .area-badge {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            border: 1px solid var(--primary-color);
            text-transform: uppercase;
        }

        .action-btn {
            background: white;
            border: 1px solid #ddd;
            color: #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
        }

        /* SECCIÓN DE NUEVO REGISTRO (FORMULARIO) */
        .card-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .card-form h3 { margin-top: 0; color: var(--primary-color); }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .controls-row {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            background-color: white;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999;
        }

        .print-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
        }

        /* TABLA */
        .table-container { width: 100%; background: transparent; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-bg); color: var(--primary-color); font-weight: 700; }
        .loading { padding: 30px; text-align: center; font-weight: bold; color: var(--primary-color); background: white; }

        @media print {
            #login-screen, .header-actions, .controls-row, .refresh-btn, .title-bar, .card-form { display: none !important; }
            #dashboard { display: block !important; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>C.M.I. "Santa Celia"</h2>
            <p>Sistema Integrado de Acceso</p>
            
            <form onsubmit="ejecutarLogin(event)">
                <div class="form-group">
                    <label>ID de Usuario:</label>
                    <input type="text" id="login-id" class="form-control" placeholder="Ej. USER o médico1" required>
                </div>
                
                <div class="form-group">
                    <label>PIN de Acceso:</label>
                    <input type="password" id="login-pin" class="form-control" placeholder="********" required>
                </div>

                <div class="form-group">
                    <label>Área o Servicio Obligatorio:</label>
                    <select id="login-area" class="form-control" required>
                        <option value="" disabled selected>-- Seleccione un área --</option>
                        <option value="MEDICINA GENERAL">Medicina General</option>
                        <option value="ODONTOLOGIA">Odontología</option>
                        <option value="LABORATORIO">Laboratorio</option>
                        <option value="BOTICA">Botica</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary-login">Ingresar al Sistema</button>
                <div id="error-box" class="error-msg">ID, PIN o área incorrectos. Verifique sus datos.</div>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard">
        <div class="header">
            <div class="title-bar">
                <div class="brand">
                    <h1 id="app-title-text">Historial Clínico</h1>
                </div>
                <div class="header-actions">
                    <span id="header-badge" class="area-badge">ÁREA</span>
                    <button class="action-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>

            <!-- FORMULARIO PARA NUEVO INGRESO DE DATOS -->
            <div class="card-form" id="formRegistroContainer">
                <h3>Nuevo Registro Clínico</h3>
                <form id="formRegistro" onsubmit="enviarDatos(event)">
                    <div class="form-grid">
                        <!-- Fila 1: Fecha, Hora Inicio, Hora Final -->
                        <div class="form-group">
                            <label>Fecha:</label>
                            <input type="text" id="fecha" class="form-control" disabled style="background-color: #e9ecef; color: #6c757d;">
                        </div>
                        <div class="form-group">
                            <label>Hora de Inicio:</label>
                            <input type="time" id="horaInicio" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Hora Final:</label>
                            <input type="time" id="horaFinal" class="form-control" required>
                        </div>

                        <!-- Fila 2: Nombres y Apellidos (Largo) -->
                        <div class="form-group full-width">
                            <label>Nombres y Apellidos:</label>
                            <input type="text" id="nombres" class="form-control" placeholder="Nombre completo del paciente" required>
                        </div>

                        <!-- Fila 3: DNI -->
                        <div class="form-group full-width">
                            <label>DNI:</label>
                            <input type="text" id="dni" class="form-control" maxlength="8" placeholder="DNI del paciente" required>
                        </div>

                        <!-- Filas 4, 5, 6, 7: Diagnóstico, Medicamentos, Médico, Observaciones (Cada uno debajo del otro, largos) -->
                        <div class="form-group full-width">
                            <label>Diagnóstico:</label>
                            <input type="text" id="diagnostico" class="form-control" placeholder="Diagnóstico médico" required>
                        </div>
                        <div class="form-group full-width">
                            <label>Medicamentos:</label>
                            <input type="text" id="medicamentos" class="form-control" placeholder="Receta o fármacos">
                        </div>
                        <div class="form-group full-width">
                            <label>Médico:</label>
                            <input type="text" id="medico" class="form-control" placeholder="Nombre del doctor" required>
                        </div>
                        <div class="form-group full-width">
                            <label>Observaciones:</label>
                            <input type="text" id="observaciones" class="form-control" placeholder="Notas adicionales">
                        </div>
                    </div>
                    <button type="submit" id="btnGuardar" class="btn-primary-login" style="margin-top: 15px;">Subir a la Base de Datos</button>
                </form>
                <div id="msgEstado" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
            </div>

            <!-- BUSCADOR Y CONTROLES -->
            <div id="search-and-refresh-area" style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
                <div class="controls-row">
                    <div class="search-container">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" class="search-input" oninput="filtrarTabla()" placeholder="Buscar paciente, DNI, diagnóstico...">
                    </div>
                    <button class="print-btn" onclick="window.print()">Imprimir Filtrados</button>
                </div>
                <button class="refresh-btn" onclick="cargarDatosHistorial()">Actualizar Registros</button>
            </div>
        </div>

        <!-- TABLA DINÁMICA -->
        <div class="table-container">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="10" class="loading">Cargando registros...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCRIPT DE LA APLICACIÓN -->
    <script>
        const sheetId = '17OvVxayB1wjiB2z8RIGcc_S68F4AWstFZuLGWdctVNg';
        const gidSheet = '0';
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQapil_hqSXDkIbMGG0LrKFExFw3gxTY7S634yvFhwkfP6zGyYBCaRRUQmDQ6MornZdA/exec';

        const usuariosAutorizados = {
            "MEDICINA GENERAL": { "medico1": "1234", "drfernando": "5678" },
            "ODONTOLOGIA":      { "dentista1": "1111", "odonto": "2222" },
            "LABORATORIO":      { "lab1": "3333" },
            "BOTICA":           { "botica1": "4444" }
        };

        let areaActual = "";

        function obtenerFechaHoraActual() {
            const ahora = new Date();
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const anio = ahora.getFullYear();
            
            // Fecha fija de hoy
            document.getElementById('fecha').value = `${dia}/${mes}/${anio}`;
            
            // Hora actual predeterminada en los selectores de hora (formato HH:MM)
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const horaActualStr = `${horas}:${minutos}`;
            
            document.getElementById('horaInicio').value = horaActualStr;
            document.getElementById('horaFinal').value = horaActualStr;
        }

        function ejecutarLogin(event) {
            event.preventDefault();
            const idInput = document.getElementById('login-id').value.trim();
            const pinInput = document.getElementById('login-pin').value.trim();
            const selectArea = document.getElementById('login-area');
            const errorBox = document.getElementById('error-box');

            areaActual = selectArea.value;
            let accesoConcedido = false;

            if (idInput === "USER" && pinInput === "171819") {
                accesoConcedido = true;
            } else if (areaActual && usuariosAutorizados[areaActual]) {
                if (usuariosAutorizados[areaActual][idInput] === pinInput) {
                    accesoConcedido = true;
                }
            }

            if (!accesoConcedido) {
                errorBox.textContent = "ID o PIN incorrectos.";
                errorBox.style.display = "block";
                return;
            }

            errorBox.style.display = "none";
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('header-badge').textContent = areaActual;
            document.getElementById('app-title-text').textContent = `Historial Clínico - ${areaActual}`;
            
            obtenerFechaHoraActual();
            cargarDatosHistorial();
        }

        function enviarDatos(event) {
            event.preventDefault();
            const btnGuardar = document.getElementById('btnGuardar');
            const msgEstado = document.getElementById('msgEstado');
            
            btnGuardar.disabled = true;
            btnGuardar.textContent = 'Subiendo a la Base de Datos...';
            msgEstado.style.color = '#555';
            msgEstado.textContent = 'Enviando información...';

            const datos = {
                fecha: document.getElementById('fecha').value,
                horaInicio: document.getElementById('horaInicio').value,
                horaFinal: document.getElementById('horaFinal').value,
                nombres: document.getElementById('nombres').value,
                dni: document.getElementById('dni').value,
                diagnostico: document.getElementById('diagnostico').value,
                medicamentos: document.getElementById('medicamentos').value,
                medico: document.getElementById('medico').value,
                observaciones: document.getElementById('observaciones').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(datos)
            })
            .then(() => {
                msgEstado.style.color = 'green';
                msgEstado.textContent = '¡Datos subidos con éxito a la Base de Datos!';
                document.getElementById('formRegistro').reset();
                obtenerFechaHoraActual();
                setTimeout(() => { 
                    msgEstado.textContent = ''; 
                    cargarDatosHistorial();
                }, 2000);
            })
            .catch(error => {
                msgEstado.style.color = 'red';
                msgEstado.textContent = 'Error al enviar datos.';
                console.error(error);
            })
            .finally(() => {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Subir a la Base de Datos';
            });
        }

        async function cargarDatosHistorial() {
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-head');
            tbody.innerHTML = '<tr><td colspan="10" class="loading">Sincronizando con Google Sheets...</td></tr>';

            const urlTabla = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gidSheet}&_=${new Date().getTime()}`;

            try {
                const response = await fetch(urlTabla);
                const text = await response.text();
                const jsonString = text.substring(text.indexOf('({') + 1, text.lastIndexOf('})') + 1);
                const data = JSON.parse(jsonString);

                thead.innerHTML = '';
                tbody.innerHTML = '';

                let trHead = document.createElement('tr');
                data.table.cols.forEach(header => {
                    if (header.label) {
                        let th = document.createElement('th');
                        th.innerText = header.label;
                        trHead.appendChild(th);
                    }
                });
                thead.appendChild(trHead);

                const rows = data.table.rows.reverse();
                if (rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="loading">No hay registros todavía.</td></tr>';
                    return;
                }

                rows.forEach(row => {
                    let tr = document.createElement('tr');
                    row.c.forEach((cell, index) => {
                        if (index < data.table.cols.length && data.table.cols[index].label) {
                            let td = document.createElement('td');
                            td.innerText = (cell && cell.f) ? cell.f : (cell && cell.v ? cell.v : '-');
                            tr.appendChild(td);
                        }
                    });
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="10" class="loading" style="color:red;">Error al cargar la tabla.</td></tr>';
            }
        }

        function cerrarSesion() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-id').value = '';
            document.getElementById('login-pin').value = '';
        }
    </script>
</body>
</html>
